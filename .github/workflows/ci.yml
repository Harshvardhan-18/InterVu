name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Tests mock every LLM, search API and database; no real keys are used.
      ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q . -x '(\.venv|chroma_db)'
      - name: Run tests
        run: python -m pytest -q

  migrations:
    name: Migrations (alembic on Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Per-run value for a throwaway container that only listens on loopback.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
          POSTGRES_DB: intervu
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d intervu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:ci-${{ github.run_id }}@127.0.0.1:5432/intervu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply migrations to an empty database
        run: python -m alembic upgrade head
      - name: Models and migrations agree (no drift)
        run: python -m alembic check
      - name: Downgrade and upgrade again
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

  frontend:
    name: Frontend (lint, build, types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # After the build so next-env.d.ts and generated route types exist.
      - name: Type check
        run: npx tsc --noEmit

  admin:
    name: Admin (Django checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intervu-admin
    env:
      DJANGO_DEBUG: "False"
      # CI-only throwaway value so the production settings path is exercised.
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-0123456789abcdefghijklmnop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: intervu-admin/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django system checks
        run: python manage.py check
